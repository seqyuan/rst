name: docs-vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/actions/setup-node-pnpm/action.yml"
      - ".github/workflows/docs-vercel.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Fumadocs Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vercel-production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          working-directory: web

      - name: Check Vercel secrets
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "missing repository secret ${name}" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Typecheck
        working-directory: web
        run: corepack pnpm typecheck

      - name: Build
        working-directory: web
        run: corepack pnpm build

      - name: Pull Vercel Environment
        working-directory: web
        run: corepack pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build With Vercel
        working-directory: web
        run: corepack pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Prebuilt To Vercel
        working-directory: web
        run: corepack pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
